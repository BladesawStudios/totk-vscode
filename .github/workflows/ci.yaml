name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'graphics/**'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'graphics/**'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Node.js modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Python Virtual Environment
        id: cache-python
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ hashFiles('pyproject.toml') }}

      - name: Install Python dependencies
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install ".[dev]"

      - name: Run TypeScript Linter
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run check-types

      - name: Run Python Ruff Linter
        run: .venv/bin/ruff check .

      - name: Run Python Ruff Formatter Check
        run: .venv/bin/ruff format --check .

      - name: Cache VS Code Test Downloads
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ hashFiles('package.json', '.vscode-test.mjs') }}

      - name: Run Extension Tests
        run: xvfb-run -a npm test

      - name: Inject Commit Hash into Version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          jq ".version += \"-$SHORT_SHA\"" package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: totk-vscode-extension
          path: "out/*.vsix"
