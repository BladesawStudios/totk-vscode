name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'graphics/**'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'graphics/**'
      - 'docs/**'
      - 'LICENSE'

jobs:
  lint-ts:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Node.js modules
        id: cache-node
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run TypeScript Linter
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run check-types

  build:
    name: Build VSIX (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint-ts]
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, linux-x64, darwin-x64, darwin-arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Node.js modules
        id: cache-node
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test the C# host
        if: matrix.target == 'linux-x64'
        run: dotnet test host/TkvscHost.slnx

      - name: Inject Commit Hash into Version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          jq ".version += \"-$SHORT_SHA\"" package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Package VSIX
        run: node scripts/package-vsix.js ${{ matrix.target }}

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tkvsc-vsix-${{ matrix.target }}
          path: "out/*.vsix"
