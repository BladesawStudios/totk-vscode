color: "#FF0000"

Effect/static.Nin_Ounce_NVN2.vsetb.byml.zs:
  Esets/Npc_Navi_*/*.emitter: tint $color

Effect/Dm_Npc_Navi.Nin_Ounce_NVN2.vsetb.byml.zs:
  Esets/*/*.emitter: tint $color

Model/Npc_Navi.Npc_Navi.bfres.zs:
  Models/Npc_Navi/Materials/*.fmat: tint $color only ns_param_color[0-5]|emission_color
  Models/Npc_Navi/Materials/Mt_Body*.fmat:
    - 'replace (ns_param_scalar3, type: Float, value:) [-\d.]+ -> $1 0.7'
    - 'replace (ns_param_scalar5, type: Float, value:) [-\d.]+ -> $1 3'
    - 'replace (ns_param_scalar6, type: Float, value:) [-\d.]+ -> $1 5'
    - 'replace (ns_param_color1, type: Float4, values:) \[[^\]]*\] -> $1 [1, 0, 0, 1]'
    - 'replace (ns_emission_intensity, type: Float, value:) [-\d.]+ -> $1 10'

Model/Npc_Navi.anim.bfres.zs:
  MaterialAnims/*.fmaa: tint $color only ns_param_color[0-5]
  MaterialAnims/Status_Default.fmaa:
    - 'replace (ns_param_color1, values:) \[[^\]]*\] -> $1 [1, 0, 0, 1]'
    - 'replace (ns_param_scalar3, value:) [-\d.]+ -> $1 0.7'
    - 'replace (ns_param_scalar5, value:) [-\d.]+ -> $1 3'
    - 'replace (ns_param_scalar6, value:) [-\d.]+ -> $1 5'
    - 'replace (ns_emission_intensity, value:) [-\d.]+ -> $1 10'
    - 'replace texture: Npc_Navi_Body_Alb.00} -> texture: Npc_Navi_Body_Alb.01}'
  MaterialAnims/Npc_Navi_Color.fmaa:
    - 'replace texture: (Npc_Navi_Wings_\w+)\.00} -> texture: $1.01}'
    - 'replace ^textures:$ -> textures:\n- Npc_Navi_Body_Alb.01'
    - 'replace \z -> - material: Mt_Body\n  patterns:\n  - {name: _a0, texture: Npc_Navi_Body_Alb.01}\n- material: Mt_Body_AlphaMask\n  patterns:\n  - {name: _a0, texture: Npc_Navi_Body_Alb.01}\n'
    - 'replace bindIndices: .* -> bindIndices: [65535, 65535, 65535]'

Tex/Npc_Navi_Body_Alb.00.bntx.zs:
  '*': tint $color

Tex/Npc_Navi_Body_Alb.01.bntx.zs:
  '*': tint $color
